name: CI

on:
  push:
    branches: [ master, main, modernize ]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (Ubuntu 24.04, GCC, daemon)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libboost-all-dev libssl-dev libdb++-dev \
            libminiupnpc-dev zlib1g-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_UPNP=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test the daemon
        run: |
          # The daemon prints help to stderr and exits non-zero (no command
          # given), so assert on the banner rather than the exit code.
          out="$(./build/HoboNickelsd --help 2>&1 || true)"
          echo "$out" | head -n 5
          echo "$out" | grep -q "HoboNickels version"

      - name: Upload Linux daemon
        uses: actions/upload-artifact@v4
        with:
          name: HoboNickelsd-linux-x86_64
          path: build/HoboNickelsd

  build-gui:
    name: Linux Qt5 GUI (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libboost-all-dev libssl-dev libdb++-dev \
            libminiupnpc-dev zlib1g-dev \
            qtbase5-dev qttools5-dev qttools5-dev-tools qtbase5-dev-tools

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_QT_GUI=ON -DBUILD_TESTS=OFF

      - name: Build GUI
        run: cmake --build build -j"$(nproc)" --target HoboNickels-qt

      - name: Smoke test (offscreen)
        run: |
          out="$(QT_QPA_PLATFORM=offscreen ./build/HoboNickels-qt -? 2>&1 || true)"
          echo "$out" | head -n 5
          echo "$out" | grep -q "HoboNickels-Qt version"

      - name: Upload Qt GUI
        uses: actions/upload-artifact@v4
        with:
          name: HoboNickels-qt-linux-x86_64
          path: build/HoboNickels-qt

  build-windows:
    name: Windows (MSYS2 mingw64, daemon)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-db
            mingw-w64-x86_64-leveldb
            mingw-w64-x86_64-miniupnpc

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SYSTEM_LEVELDB=ON \
            -DENABLE_UPNP=ON \
            -DBUILD_TESTS=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)" --target HoboNickelsd

      - name: Smoke test
        run: |
          out="$(./build/HoboNickelsd.exe --help 2>&1 || true)"
          echo "$out" | head -n 5
          echo "$out" | grep -q "HoboNickels version"

      - name: Bundle runtime DLLs
        run: |
          # Make the binary self-contained: copy every mingw64 DLL it depends on
          # (libgcc_s_seh-1, libwinpthread-1, libstdc++-6, libcrypto-3-x64,
          # boost, db, leveldb, miniupnpc, ...) next to the .exe.
          mkdir -p dist/HoboNickelsd
          cp build/HoboNickelsd.exe dist/HoboNickelsd/
          ldd build/HoboNickelsd.exe | awk '/\/mingw64\/bin\// {print $3}' | sort -u \
            | while read -r dll; do cp -v "$dll" dist/HoboNickelsd/; done
          ls -la dist/HoboNickelsd/

      - name: Verify bundle is self-contained (mingw64 off PATH)
        run: |
          # Run from the bundle with mingw64 removed from PATH: only the DLLs
          # shipped alongside the .exe (and Windows system DLLs) can resolve.
          # If anything is missing the process exits 0xC0000135 (DLL not found).
          cd dist/HoboNickelsd
          export PATH="/c/Windows/System32:/c/Windows"
          out="$(./HoboNickelsd.exe --help 2>&1 || true)"
          echo "$out" | head -n 5
          echo "$out" | grep -q "HoboNickels version"

      - name: Upload Windows daemon (with DLLs)
        uses: actions/upload-artifact@v4
        with:
          name: HoboNickelsd-windows-x86_64
          path: dist/HoboNickelsd

  build-windows-gui:
    name: Windows Qt5 GUI (MSYS2 mingw64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-db
            mingw-w64-x86_64-leveldb
            mingw-w64-x86_64-miniupnpc
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SYSTEM_LEVELDB=ON \
            -DENABLE_UPNP=ON \
            -DWITH_QT_GUI=ON \
            -DBUILD_TESTS=OFF

      - name: Build GUI
        run: cmake --build build -j"$(nproc)" --target HoboNickels-qt

      - name: Verify the .exe was produced
        run: |
          test -f build/HoboNickels-qt.exe
          file build/HoboNickels-qt.exe

      - name: Bundle Qt + runtime DLLs (windeployqt)
        run: |
          mkdir -p dist/HoboNickels-qt
          cp build/HoboNickels-qt.exe dist/HoboNickels-qt/
          # windeployqt brings in the Qt DLLs and the platforms/qwindows.dll
          # plugin (required for the app to start on Windows).
          windeployqt --release --no-translations --no-compiler-runtime \
            dist/HoboNickels-qt/HoboNickels-qt.exe
          # windeployqt does not cover the non-Qt deps (libgcc, libstdc++,
          # libwinpthread, openssl, boost, db, leveldb, miniupnpc) — add them.
          ldd build/HoboNickels-qt.exe | awk '/\/mingw64\/bin\// {print $3}' | sort -u \
            | while read -r dll; do cp -n "$dll" dist/HoboNickels-qt/; done
          ls -la dist/HoboNickels-qt/

      - name: Verify bundle is self-contained (mingw64 off PATH)
        run: |
          cd dist/HoboNickels-qt
          # Required DLLs and the Qt platform plugin must be present.
          test -f platforms/qwindows.dll
          for d in Qt5Core.dll Qt5Gui.dll Qt5Widgets.dll Qt5Network.dll \
                   libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            test -f "$d" || { echo "MISSING $d"; exit 1; }
          done
          ls libcrypto-*.dll
          # Launch with mingw64 off PATH; a missing/unresolved DLL aborts the
          # process at load with 0xC0000135 / 0xC0000139 before the GUI starts.
          export PATH="/c/Windows/System32:/c/Windows"
          set +e
          timeout 25 ./HoboNickels-qt.exe -? >/dev/null 2>&1
          code=$?
          set -e
          echo "exit code: $code"
          if [ "$code" = "3221225781" ] || [ "$code" = "3221225595" ]; then
            echo "DLL load failure (missing dependency)"; exit 1
          fi

      - name: Upload Windows Qt GUI (with DLLs)
        uses: actions/upload-artifact@v4
        with:
          name: HoboNickels-qt-windows-x86_64
          path: dist/HoboNickels-qt

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hobonickels:ci .
      - name: Smoke test image
        run: |
          out="$(docker run --rm hobonickels:ci --help 2>&1 || true)"
          echo "$out" | head -n 5
          echo "$out" | grep -q "HoboNickels version"
